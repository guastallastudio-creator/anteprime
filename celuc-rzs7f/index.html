function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.d));
  var html=new TextDecoder().decode(buf);
  try{sessionStorage.setItem('pv',pw)}catch(e){}
